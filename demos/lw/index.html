<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liénard–Wiechert Potential Explorer (WASM)</title>
  <style>
    html { height: 100%; }
    body { margin: 0; font-family: sans-serif; background: #e5eef2; height: 100%; }
    #ui { padding: 10px; display: flex; gap: 12px; align-items: center; background: #121826; color: #e6e6eb; }
    canvas { display: block; position: relative; margin-left: auto; margin-right: auto; top: 50%; transform: translateY(-50%); }
    #display { height: 100%; }
  </style>
</head>
<body>
<div id="ui">
  <button id="play">Play / Pause</button>
  <span id="framerate">0 FPS</span>
</div>
<div id="display">
  <canvas id="canvas"></canvas>
</div>

<script type="module" src="bootstrap.js"></script>
</body>
</html>
